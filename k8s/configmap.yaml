apiVersion: v1
kind: ConfigMap
metadata:
  name: momtest-config
  namespace: momtest
  labels:
    app.kubernetes.io/name: momtest
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  # K8s internal DNS: momtest-postgres resolves to the postgres Service in the same namespace
  DATABASE_URL: "postgresql://momtest:momtest@momtest-postgres:5432/momtest"
  POSTGRES_DB: "momtest"
  POSTGRES_USER: "momtest"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
