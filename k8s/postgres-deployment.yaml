# ── PersistentVolumeClaim ──────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: momtest
  labels:
    app.kubernetes.io/name: momtest
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ── PostgreSQL Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: momtest-postgres
  namespace: momtest
  labels:
    app.kubernetes.io/name: momtest
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: momtest-postgres
  template:
    metadata:
      labels:
        app: momtest-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: momtest-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: momtest-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: momtest-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command: [pg_isready, -U, momtest, -d, momtest]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [pg_isready, -U, momtest, -d, momtest]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# ── PostgreSQL Service ─────────────────────────────────────────────────────
# ClusterIP: internal only — app connects via "momtest-postgres:5432"
apiVersion: v1
kind: Service
metadata:
  name: momtest-postgres
  namespace: momtest
  labels:
    app.kubernetes.io/name: momtest
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: momtest-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
