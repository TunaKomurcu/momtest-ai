# Apply all manifests in dependency order:
#   kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: momtest

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres-deployment.yaml
  - app-deployment.yaml

commonLabels:
  project: momtest
  environment: local
