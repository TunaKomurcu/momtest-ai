apiVersion: apps/v1
kind: Deployment
metadata:
  name: momtest-app
  namespace: momtest
  labels:
    app.kubernetes.io/name: momtest
    app.kubernetes.io/component: app
  annotations:
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: momtest-app
  template:
    metadata:
      labels:
        app: momtest-app
    spec:
      # Wait for PostgreSQL to accept connections before starting the app
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z momtest-postgres 5432; do echo "waiting for postgres..."; sleep 2; done

      containers:
        - name: momtest-app
          # Build the image into Minikube's daemon before deploying:
          #   eval $(minikube docker-env)
          #   docker build -t momtest-app:latest .
          image: momtest-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: momtest-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: momtest-secrets
                  key: OPENAI_API_KEY
            - name: NVCF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: momtest-secrets
                  key: NVCF_API_KEY
                  optional: true
            - name: MAKE_WEBHOOK_INTERVIEW_URL
              valueFrom:
                secretKeyRef:
                  name: momtest-secrets
                  key: MAKE_WEBHOOK_INTERVIEW_URL
                  optional: true
            - name: MAKE_WEBHOOK_ANALYSIS_URL
              valueFrom:
                secretKeyRef:
                  name: momtest-secrets
                  key: MAKE_WEBHOOK_ANALYSIS_URL
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Startup probe: guards liveness during slow cold-start (~45s)
          startupProbe:
            httpGet:
              path: /api/projects
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          # Liveness probe: restarts pod on deadlock or unrecoverable error
          livenessProbe:
            httpGet:
              path: /api/projects
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness probe: removes pod from Service endpoints until DB is reachable
          readinessProbe:
            httpGet:
              path: /api/projects
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
      terminationGracePeriodSeconds: 30

---
# NodePort exposes the app through Minikube's IP.
# Access via: minikube service momtest-app-service -n momtest
apiVersion: v1
kind: Service
metadata:
  name: momtest-app-service
  namespace: momtest
  labels:
    app.kubernetes.io/name: momtest
    app.kubernetes.io/component: app
spec:
  type: NodePort
  selector:
    app: momtest-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
