# =============================================================================
# docker-compose.yml — MomTest AI Local Geliştirme Ortamı
#
# KULLANIM:
#   Sadece DB (aktif geliştirme için):
#     docker compose up db
#
#   Tam uygulama (integration test için):
#     docker compose --profile app up
#
# NOT: Uygulama geliştirirken genellikle sadece `docker compose up db`
#      yeterlidir. Next.js'i `npm run dev` ile local çalıştırırsın.
#      `--profile app` ile çalıştırmak tam Docker ortamını test etmek içindir.
# =============================================================================

version: '3.8'

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  # Tek kalıcı servis. Geliştirme sırasında her zaman çalışır.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: momtest
      POSTGRES_PASSWORD: momtest
      POSTGRES_DB: momtest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momtest -d momtest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Next.js Uygulaması ─────────────────────────────────────────────────────
  # Sadece `--profile app` ile başlar. Dockerfile multi-stage build kullanır.
  # Normal geliştirmede bu servise gerek yok — `npm run dev` daha hızlı.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    profiles:
      - app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://momtest:momtest@db:5432/momtest
      NODE_ENV: production
      APP_LLM_MODE: ${APP_LLM_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAKE_WEBHOOK_INTERVIEW_URL: ${MAKE_WEBHOOK_INTERVIEW_URL:-}
      MAKE_WEBHOOK_ANALYSIS_URL: ${MAKE_WEBHOOK_ANALYSIS_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/projects || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
    # Named volume: `docker compose down` sonrasında veri korunur.
    # Tamamen sıfırlamak için: docker volume rm <project>_postgres_data
